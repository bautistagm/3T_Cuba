# Base de datos local para desarrollo: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tresT
      POSTGRES_PASSWORD: tresT
      POSTGRES_DB: tresT_dev
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./apps/api/scripts/crear-base-test.sql:/docker-entrypoint-initdb.d/crear-base-test.sql:ro
volumes:
  datos:
